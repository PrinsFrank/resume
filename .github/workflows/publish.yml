name: Publish Resume

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            resume.xtx
          latexmk_use_xelatex: true
          docker_image: ghcr.io/xu-cheng/texlive-full:20230401

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            resume.pdf
          tag_name: latest
